# Publishes airos-tui to PyPI on each published GitHub release, through PyPI's trusted
# publishing (OIDC: no token stored anywhere). The release's tag must be "v" and the version
# in airos_tui/__init__.py (v2.0 for 2.0); otherwise nothing is published.
#
# On PyPI, the trusted publisher: owner Nibblex, repository airos-tui, workflow publish.yml,
# environment pypi. The actions are pinned to their commits (their version, beside them).
name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Check that the tag is the package's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import airos_tui; print(airos_tui.__version__)')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the release's tag ($TAG) is not v$version (airos_tui/__init__.py)"
            exit 1
          fi
      - name: Build the sdist and the wheel, and check them
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/airos-tui/
    permissions:
      id-token: write        # (trusted publishing: PyPI checks this job's OIDC token)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
